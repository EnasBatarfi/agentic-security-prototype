<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>File Manager</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header>
    <h2>File Manager</h2>

    <nav>
      <a href="{% url 'file_list' %}">Files</a>
      <a href="{% url 'file_upload' %}">Upload</a>
      <a href="{% url 'file_chat' %}">File Chat</a>
      <a href="{% url 'profile_chat' %}">Profile Chat</a>

      {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit">Logout</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'signup' %}">Signup</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
